<!-- Local review harness for the progression targets: loads the prototype state copy into
     localStorage (python scratchpad/proto_progression.py writes it), opens the app in a frame,
     then plays one scene.
     ?person=0|1 &theme=light|dark &scene=session|settings|wrench|tickfill &ex=<exercise name>
     person 0 is Daniel, 1 is Cerys. Never touches the shared store. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html,body{margin:0;height:100%}iframe{border:0;width:100%;height:100%;display:block}</style>
<iframe id="f"></iframe>
<script>
const q = new URLSearchParams(location.search);
const person = +(q.get("person") || 0), theme = q.get("theme") || "light", scene = q.get("scene") || "session";
const wait = ms => new Promise(r => setTimeout(r, ms));
(async () => {
  const s = await fetch("/scratchpad/proto-progression-state.json", {cache: "no-store"}).then(r => r.json());
  s.theme = theme;
  s.activePerson = person;
  localStorage.clear();
  localStorage.setItem("flLiveTracker_v1", JSON.stringify(s));
  const f = document.getElementById("f");
  f.src = "/index.html";
  await new Promise(r => f.onload = r);
  await wait(500);
  const w = f.contentWindow, d = f.contentDocument;
  const name = q.get("ex") || (scene === "wrench" && person === 0 ? "Triceps pushdown" : "Bench press");
  const card = () => d.querySelector('.ex[data-name="' + name + '"]');
  const show = el => w.scrollTo({top: el.getBoundingClientRect().top + w.scrollY - 150, behavior: "instant"});
  w.eval('curSession="upper1"'); w.switchTab("log");
  await wait(300);
  d.querySelectorAll("dialog[open]").forEach(x => x.close());
  if (scene === "settings") {
    d.getElementById("settingsBtn").click();
    await wait(300);
    d.getElementById("pProg").scrollIntoView({block: "center"});
    return;
  }
  if (scene === "wrench") {
    card().querySelector("[data-exnotes-toggle]").click();
  }
  if (scene === "tickfill") {
    const rows = card().querySelectorAll("tbody tr");
    rows[0].querySelector("[data-done]").click();
    rows[1].querySelector("[data-done]").click();
    rows[2].querySelector("[data-setno]").click();
    w.stopRest();
  }
  show(card());
})();
</script>
