<!-- Local review stage for the redesigned Program tab (version 2.1.0): loads the state copy into
     localStorage (python scratchpad/proto_program_tab.py writes it), opens the app in a frame, then
     plays one scene. Never touches the shared store.
     ?scene=week|day|session|sheet|changes|other|both &person=0|1 &theme=light|dark
       week     the week table, Daniel
       day      Tuesday's page: three sessions, one starred
       session  Upper A with its Days box open
       sheet    an exercise open in the bottom sheet
       changes  the Changes waiting list with two ticked (coach changes and Mum's edit)
       other    Daniel in Mum's program with one edit staged, ready to send
       both     Daniel on Upper A, then Cerys, then Daniel again: each keeps their own place
     The page needs a phone-sized window: it is a frame at the width of the window. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html,body{margin:0;height:100%;background:#888}iframe{border:0;width:100%;height:100%;display:block}
#note{position:fixed;top:0;left:0;right:0;z-index:9;background:#111;color:#fff;font:12px system-ui;padding:4px 8px}</style>
<div id="note" hidden></div>
<iframe id="f"></iframe>
<script>
const q = new URLSearchParams(location.search);
const person = +(q.get("person") || 0), theme = q.get("theme") || "light", scene = q.get("scene") || "week";
const wait = ms => new Promise(r => setTimeout(r, ms));
(async () => {
  const s = await fetch("/scratchpad/proto-program-tab-state.json", {cache: "no-store"}).then(r => r.json());
  s.theme = theme;
  s.activePerson = person;
  localStorage.clear();
  localStorage.setItem("flLiveTracker_v1", JSON.stringify(s));
  const f = document.getElementById("f");
  f.src = "/index.html";
  await new Promise(r => f.onload = r);
  await wait(500);
  const w = f.contentWindow, d = f.contentDocument;
  d.querySelectorAll("dialog[open]").forEach(x => x.close());
  const click = async sel => { const e = d.querySelector(sel); if (!e) throw new Error("missing " + sel); e.click(); await wait(250); };
  const person_ = async n => { await click('#ptoggle [data-p="' + n + '"]'); };
  const tabEdit = async () => { w.switchTab("edit"); await wait(300); };
  const openUpperA = async () => { await click('[data-pga="day"][data-d="Tuesday"]'); await click('[data-pga="open"]'); };
  await tabEdit();
  if (scene === "day") await click('[data-pga="day"][data-d="Tuesday"]');
  if (scene === "session") { await openUpperA(); await click('[data-pga="daystoggle"]'); }
  if (scene === "sheet") { await openUpperA(); d.querySelectorAll('[data-pga="ex"]')[3].click(); await wait(300); }
  if (scene === "changes") {
    await click('[data-pga="chg"]');
    d.querySelectorAll('#pgSheet input[type=checkbox]').forEach((c, i) => { if (i === 0 || i === 3) c.click(); });
    await wait(200);
  }
  if (scene === "other") {
    await click('[data-pga="picker"]');
    d.querySelector('#pgSheet input[value="p-mum"]').click();
    await click('[data-pga="pickgo"]');
    await click('[data-pga="day"][data-d="Tuesday"]'); await click('[data-pga="open"]');
    w.eval('editProg().sessions["full-a"].exercises[0].sets=3; editProg().sessions["full-a"].exercises[0].target="3x10-12"; renderEdit()');
    await wait(300);
  }
  if (scene === "both") {
    await openUpperA();
    await person_(1);
    const cerysRoute = w.eval("pgU().route");
    await person_(0);
    const note = document.getElementById("note");
    note.hidden = false;
    note.textContent = "Cerys was on the " + cerysRoute + " page; Daniel is back on the " + w.eval("pgU().route") + " page: " + w.eval("editProg().sessions[pgU().key].name");
  }
})().catch(e => { const n = document.getElementById("note"); n.hidden = false; n.textContent = "Stage error: " + e.message; });
</script>
