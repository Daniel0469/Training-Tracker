<!-- Local review harness for per-person programs: loads the prototype state copy into
     localStorage (python scratchpad/proto_programs.py writes it), opens the app in a frame,
     then plays one scene.
     ?person=0|1|2 &theme=light|dark &scene=program|picker|banner|clash|copy|log
     person 0 is Daniel, 1 is Cerys (they share a program), 2 is Mum (her own).
       program  the Program tab on the person's own program
       picker   Daniel editing Mum's program with one change typed, ready to send
       banner   the Accept / Decline banner on the Program tab (use person=2, Mum)
       clash    Daniel's editor opened on Mum's program, then Mum's version moves
       copy     the Copy session to ... box on Daniel's Program tab
       log      the Logging tab on the person's own session list
     Never touches the shared store. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html,body{margin:0;height:100%}iframe{border:0;width:100%;height:100%;display:block}</style>
<iframe id="f"></iframe>
<script>
const q = new URLSearchParams(location.search);
const person = +(q.get("person") || 0), theme = q.get("theme") || "light", scene = q.get("scene") || "program";
const wait = ms => new Promise(r => setTimeout(r, ms));
(async () => {
  const s = await fetch("/scratchpad/proto-programs-state.json", {cache: "no-store"}).then(r => r.json());
  s.theme = theme;
  s.activePerson = person;
  localStorage.clear();
  localStorage.setItem("flLiveTracker_v1", JSON.stringify(s));
  const f = document.getElementById("f");
  f.src = "/index.html";
  await new Promise(r => f.onload = r);
  await wait(500);
  const w = f.contentWindow, d = f.contentDocument;
  d.querySelectorAll("dialog[open]").forEach(x => x.close());
  const tab = t => { w.switchTab(t); return wait(300); };
  if (scene === "log") { await tab("log"); return; }
  if (scene === "banner") { await tab("edit"); return; }
  await tab("edit");
  if (scene === "picker") {
    const sel = d.getElementById("progPick");
    sel.value = "p-mum"; sel.dispatchEvent(new w.Event("change"));
    await wait(300);
    w.eval('openExDlg(progSel, 0)');
    await wait(200);
    d.getElementById("exSets").value = "3";
    d.getElementById("exSave").click();
    await wait(300);
  }
  if (scene === "clash") {
    const sel = d.getElementById("progPick");
    sel.value = "p-mum"; sel.dispatchEvent(new w.Event("change"));
    await wait(300);
    w.eval('state.programs["p-mum"].version=4; state.programs["p-mum"].updatedBy="Mum"; renderEdit()');
    await wait(300);
  }
  if (scene === "copy") {
    d.querySelector("[data-copyex]").click();
    await wait(300);
  }
})();
</script>
