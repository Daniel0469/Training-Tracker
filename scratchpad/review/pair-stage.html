<!-- Local review harness for the typed pairing code (2.0.3): loads a copy of the store (the newest data-backup in
     scratchpad/, gitignored) into localStorage, opens the app in a frame, then plays one scene.
     ?scene=show-code|type-code|wrong-code &theme=light|dark &person=0|1
     show-code   a connected phone, Show setup code, the family password typed and checked: the QR code, the short code with its
                 10-minute countdown and Cancel code (&qr=0 hides the QR part, as it is after 60 seconds)
     type-code   a phone with no connection: Connection open, a pairing code typed in the Type a pairing code box (&go=1 presses Pair)
     wrong-code  the same, with a code the storage does not know, Pair pressed: the message under Connect
     Everything is a stand-in: the storage address is a made-up name, the storage is a small object in this page, the storage library
     never loads, and only the QR library comes from the network. Never touches the shared store. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html,body{margin:0;height:100%}iframe{border:0;width:100%;height:100%;display:block}</style>
<iframe id="f"></iframe>
<script>
const q = new URLSearchParams(location.search);
const person = +(q.get("person") || 0), theme = q.get("theme") || "light", scene = q.get("scene") || "show-code";
const wait = ms => new Promise(r => setTimeout(r, ms));
const BACKUPS = ["/scratchpad/data-backup-20261103T180000Z.json", "/scratchpad/data-backup-20261102T131207Z.json"];
const STAGE = {url: "https://stage-family.supabase.co", key: "sb_publishable_stageexamplekey000000", email: "family@example.test", password: "stage-pass", code: "K7P4QX"};
async function loadStore() {
  for (const u of BACKUPS) { const r = await fetch(u, {cache: "no-store"}); if (r.ok) return r.json(); }
  throw new Error("no data-backup-*.json in scratchpad/");
}
const frame = document.getElementById("f");
const load = () => new Promise(r => { frame.onload = r; frame.src = "/index.html"; });
(async () => {
  const s = await loadStore();
  s.theme = theme;
  s.activePerson = person;
  localStorage.clear();
  localStorage.setItem("flLiveTracker_v1", JSON.stringify(s));
  await load();
  await wait(600);
  const w = frame.contentWindow, d = frame.contentDocument;
  const E = code => w.eval(code);
  d.querySelectorAll("dialog[open]").forEach(x => x.close());
  // Only the QR library may load. The storage library and every other script is dropped.
  E('(function(){const add=document.head.appendChild.bind(document.head);document.head.appendChild=function(n){if(n&&/qrcodejs/.test(n.src||""))return add(n);}})()');
  // The storage: a sign-in that accepts the stage password, the pairing rows, and the two pairing functions.
  window.stageStorage = function (password, sealed, hang) {
    const rows = new Map();
    return {
      auth: {signInWithPassword: async args => hang ? new Promise(() => {}) : ({error: args.password === password ? null : {message: "Invalid login credentials"}})},
      from: () => ({insert: async row => { rows.set(row.code_hash, row); return {error: null}; }}),
      rpc: async (name, args) => name === "tt_pair_claim"
        ? {data: sealed && args.p_code_hash === sealed.code_hash ? Object.assign({status: "ok"}, sealed) : {status: "none"}, error: null}
        : {data: null, error: null},
    };
  };
  const connectedPhone = () => E('sb.url=' + JSON.stringify(STAGE.url) + ';sb.key=' + JSON.stringify(STAGE.key) + ';sb.email=' + JSON.stringify(STAGE.email)
    + ';sb.mode="supabase";sbClient=parent.stageStorage(' + JSON.stringify(STAGE.password) + ');renderFamilyStorage()');
  const openAdmin = async () => {
    d.getElementById("settingsBtn").click();
    E('setSettingsTab("admin"); adminUnlocked=true; renderAdminGate()');
    await wait(300);
  };

  if (scene === "show-code") {
    connectedPhone();
    await openAdmin();
    d.getElementById("fsShowSetup").click();
    await wait(300);
    d.getElementById("setupPass").value = STAGE.password;
    d.getElementById("setupGo").click();
    await wait(2500);
    if (q.get("qr") === "0") E("setupQrEnd('The QR code was hidden after 60 seconds.')");
    d.getElementById("setupDlg").scrollTop = 0;
  } else if (scene === "type-code" || scene === "wrong-code") {
    const sealed = await E('pairSeal(' + JSON.stringify(STAGE.code) + ',' + JSON.stringify(STAGE.email) + ',' + JSON.stringify(STAGE.password) + ')');
    w.stageSealed = sealed;
    E('sbClient=parent.stageStorage(' + JSON.stringify(STAGE.password) + ', window.stageSealed, true)');
    await openAdmin();
    d.getElementById("fsCfg").open = true;
    d.getElementById("fsUrl").value = STAGE.url; d.getElementById("fsKey").value = STAGE.key;
    d.getElementById("fsPair").value = scene === "wrong-code" ? "M4T-9ZB" : "k7p-4qx";
    if (scene === "wrong-code" || q.get("go")) d.getElementById("fsPairUse").click();
    await wait(1500);
    d.getElementById(scene === "wrong-code" ? "fsConnect" : "fsPairUse").scrollIntoView({block: "center"});
  }
})();
</script>
