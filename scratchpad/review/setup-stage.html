<!-- Local review harness for the family setup code (2.0.2): loads a copy of the store (the newest data-backup in
     scratchpad/, gitignored) into localStorage, opens the app in a frame, then plays one scene.
     ?scene=show-ask-password|show-qr|receive-connecting|paste &theme=light|dark &person=0|1
     show-ask-password  Admin > Family storage on a connected phone, Show setup code pressed: the password step
     show-qr            the family password typed and checked (a stand-in sign-in): the QR code, the countdown and the text code
     receive-connecting a setup link used on another phone: Family storage filled in, "Signing in..." under Connect
     paste              Connect form with a setup code pasted (&bad=1 for a damaged one: the message under Connect)
     Everything is a stand-in: the storage address is a made-up name, the sign-in is a stub, the storage library never loads,
     and only the QR library comes from the network. Never touches the shared store. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html,body{margin:0;height:100%}iframe{border:0;width:100%;height:100%;display:block}</style>
<iframe id="f"></iframe>
<script>
const q = new URLSearchParams(location.search);
const person = +(q.get("person") || 0), theme = q.get("theme") || "light", scene = q.get("scene") || "show-qr";
const wait = ms => new Promise(r => setTimeout(r, ms));
const BACKUPS = ["/scratchpad/data-backup-20261103T180000Z.json", "/scratchpad/data-backup-20261102T131207Z.json"];
const STAGE = {url: "https://stage-family.supabase.co", key: "sb_publishable_stageexamplekey000000", email: "family@example.test", password: "stage-pass"};
async function loadStore() {
  for (const u of BACKUPS) { const r = await fetch(u, {cache: "no-store"}); if (r.ok) return r.json(); }
  throw new Error("no data-backup-*.json in scratchpad/");
}
const frame = document.getElementById("f");
const load = () => new Promise(r => { frame.onload = r; frame.src = "/index.html"; });
(async () => {
  const s = await loadStore();
  s.theme = theme;
  s.activePerson = person;
  localStorage.clear();
  localStorage.setItem("flLiveTracker_v1", JSON.stringify(s));
  await load();
  await wait(600);
  const w = frame.contentWindow, d = frame.contentDocument;
  const E = code => w.eval(code);
  d.querySelectorAll("dialog[open]").forEach(x => x.close());
  // Only the QR library may load. The storage library and every other script is dropped.
  E('(function(){const add=document.head.appendChild.bind(document.head);document.head.appendChild=function(n){if(n&&/qrcodejs/.test(n.src||""))return add(n);}})()');
  const connectedPhone = () => E('sb.url=' + JSON.stringify(STAGE.url) + ';sb.key=' + JSON.stringify(STAGE.key) + ';sb.email=' + JSON.stringify(STAGE.email)
    + ';sb.mode="supabase";sbClient={auth:{signInWithPassword:async({password})=>({error:password===' + JSON.stringify(STAGE.password) + '?null:{message:"Invalid login credentials"}})}};renderFamilyStorage()');
  const openAdmin = async () => {
    d.getElementById("settingsBtn").click();
    E('setSettingsTab("admin"); adminUnlocked=true; renderAdminGate()');
    await wait(300);
  };
  const code = () => btoa(JSON.stringify({v: 1, url: STAGE.url, key: STAGE.key, email: STAGE.email, password: STAGE.password})).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");

  if (scene === "show-ask-password" || scene === "show-qr") {
    connectedPhone();
    await openAdmin();
    d.getElementById("fsShowSetup").click();
    await wait(300);
    if (scene === "show-qr") {
      d.getElementById("setupPass").value = STAGE.password;
      d.getElementById("setupGo").click();
      await wait(2500);
    }
  } else if (scene === "receive-connecting") {
    // The phone has an account; the family storage is not set up yet. The address carried a setup code.
    E('setupReceive("tt-setup=' + code() + '")');
    await wait(400);
    E("adminUnlocked=true; renderAdminGate()");
    await wait(300);
    d.getElementById("fsConnect").scrollIntoView({block: "center"});
  } else if (scene === "paste") {
    await openAdmin();
    d.getElementById("fsCfg").open = true;
    const box = d.getElementById("fsSetupPaste");
    box.value = q.get("bad") ? "this is not a code" : "https://app.example.test/Training-Tracker/#tt-setup=" + code();
    d.getElementById("fsSetupUse").click();
    await wait(400);
    if (q.get("filled")) box.value = "https://app.example.test/Training-Tracker/#tt-setup=" + code();
    d.getElementById("fsConnect").scrollIntoView({block: "center"});
  }
})();
</script>
